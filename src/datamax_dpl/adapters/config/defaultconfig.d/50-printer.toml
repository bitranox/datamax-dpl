# ==============================================================================
# Printer Configuration - the Datamax printer this CLI renders for and prints to
# ==============================================================================
#
# Settings are loaded via lib_layered_config and can be overridden via:
#   - App/Host/User config files (see precedence list in defaultconfig.toml)
#   - Environment variables (see below)
#   - Command-line flags (--model, --printer and friends win over everything here)
#
# Environment Variable Naming
# ---------------------------
#   Format: <SLUG>___<SECTION>__<KEY>=<VALUE>
#
#   Examples:
#     DATAMAX_DPL___PRINTER__MODEL=dmx-600
#     DATAMAX_DPL___PRINTER__URI=tcp://192.0.2.60:9100
#
# .env File Support
# -----------------
# In .env files (no prefix needed), use double underscore for nesting:
#
#   PRINTER__MODEL=dmx-600
#   PRINTER__URI=serial:///dev/ttyS0?baud=9600
#
# Precedence (lowest to highest):
#   defaults -> app config -> host config -> user config -> .env file -> env vars
#
[printer]

# Purpose: Printer model profile that decides which DPL features may be used.
#          'datamax-dpl models' lists every profile. 'generic' emits only what
#          every model in the manual understands.
# Type: string
# Default: "generic"
# Environment Variable: DATAMAX_DPL___PRINTER__MODEL=dmx-600
model = "generic"

# Purpose: Firmware version of the printer, when a feature depends on it
#          (for example "2.01" unlocks circles on a DMX 400). Empty: assume the
#          oldest firmware the manual describes.
# Type: string, "<major>.<minor>"
# Default: ""
# Environment Variable: DATAMAX_DPL___PRINTER__FIRMWARE=2.01
firmware = ""

# Purpose: Where 'print' and the printer commands send their bytes.
#          tcp://HOST:PORT              raw socket, usually port 9100
#          serial:///dev/ttyS0?baud=9600&parity=N&bytesize=8&stopbits=1
#          device:///dev/usb/lp0        write to a device file
#          file:PATH                    write to a file
#          -                            write to stdout
#          Empty: every command that talks to a printer needs --printer.
# Type: string
# Default: ""
# Environment Variable: DATAMAX_DPL___PRINTER__URI=tcp://192.0.2.60:9100
uri = ""

# Purpose: What to do when the label uses a feature the model lacks.
#          degrade: apply the documented fallback and report each one
#          strict:  refuse the label instead
# Type: string, "degrade" or "strict"
# Default: "degrade"
# Environment Variable: DATAMAX_DPL___PRINTER__POLICY=strict
policy = "degrade"

# Purpose: Timeout for one transport operation (connect, write one piece of a
#          job, an answer), in seconds. 'status' and 'memory' wait status_wait
#          in all for their first answer.
# Type: float, greater than 0, at most 2147483
# Default: 10.0
# Environment Variable: DATAMAX_DPL___PRINTER__TIMEOUT=10.0
timeout = 10.0

# Purpose: Seconds 'status' and 'memory' keep trying for the printer's first
#          answer while a print server is still busy with an earlier job. A
#          connection that took no request (refused, timed out while
#          connecting, closed or reset before the request or a byte of answer)
#          is tried again on a new one; an open but silent connection is read
#          until the wait ends and never asked twice. 'memory' waits at most
#          directory_read_limit (120 s) per answer on one connection. --timeout on those commands sets the whole
#          wait instead.
# Type: float, greater than 0, at most 2147483
# Default: 30.0
# Environment Variable: DATAMAX_DPL___PRINTER__STATUS_WAIT=45
# status_wait = 30.0

# Purpose: Seconds 'status' and 'memory' pause between two connections within
#          status_wait, and 'print' within stored_names_wait. A
#          refused connect within one connection's opening is retried by
#          refused_connect_wait and refused_connect_retry_interval instead.
# Type: float, greater than 0, at most 2147483
# Default: 0.25
# Environment Variable: DATAMAX_DPL___PRINTER__ANSWER_RETRY_INTERVAL=0.5
# answer_retry_interval = 0.25

# Purpose: Seconds 'print' keeps trying for each read of the
#          printer's stored image names (<STX>W): right before each label's
#          downloads no clear precedes, and in each round of the upload check
#          after a label's downloads. The answer's last byte must arrive within it (the 1 s of
#          silence that ends the answer comes on top); 'status' and 'memory'
#          use status_wait. A printer was measured
#          silent for 10-20 s after an image job, so a repeat print right after
#          one still reads the names. On a link that never answers, each read
#          waits this long, and the upload check refuses the label after its
#          rounds; lower it there. --timeout leaves it.
# Type: float, greater than 0, at most 2147483
# Default: 30.0
# Environment Variable: DATAMAX_DPL___PRINTER__STORED_NAMES_WAIT=10
# stored_names_wait = 30.0

# Purpose: Seconds of silence that end a <STX>W directory answer, which has
#          no terminator: every names read of 'print' and every answer of
#          'memory' (whose --idle wins). Raise it for a print server or a
#          printer that pauses mid-listing, which otherwise cuts the listing
#          short; lower it on a fast link, since each read ends this long after
#          the last byte.
# Type: float, greater than 0, at most 2147483
# Default: 1.0
# Environment Variable: DATAMAX_DPL___PRINTER__DIRECTORY_IDLE=2
# directory_idle = 1.0

# Purpose: Longest one 'memory' answer may take, from the request to the
#          silence that ends it, per kind; one still running then is a timeout.
#          120 s fits a 64 KiB listing at 9600 baud; 2400 baud needs about
#          273 s for that. 'print' bounds its names reads by stored_names_wait.
#          It must be longer than directory_idle, or no answer could end
#          within it; such a value is refused.
# Type: float, greater than 0, at most 2147483
# Default: 120.0
# Environment Variable: DATAMAX_DPL___PRINTER__DIRECTORY_READ_LIMIT=300
# directory_read_limit = 120.0

# Purpose: Whether 'print' asks the printer for a reset report (<SOH>A) before
#          a job on a two-way link. false asks nothing and acts on no report,
#          not even one a names read carries. Warning: the first label after a
#          power cycle may then print shifted (one Allegro 2: about 12 mm) with
#          nothing said.
# Type: boolean
# Default: true
# Environment Variable: DATAMAX_DPL___PRINTER__RESET_CHECK=false
# reset_check = true

# Purpose: Seconds 'print' waits for the one status read (<SOH>A)
#          it makes before a job on a two-way link: the printer's first answer
#          after a power cycle or a software reset reports it, once. One try, no
#          retry. No answer means nothing: the job goes on as it would have.
#          --timeout leaves it.
# Type: float, greater than 0, at most 2147483
# Default: 3.0
# Environment Variable: DATAMAX_DPL___PRINTER__RESET_CHECK_WAIT=1
# reset_check_wait = 3.0

# Purpose: On a reported reset, print one calibration label before the job: the
#          job's printer settings and label size, one text in the middle. One
#          Allegro 2 printed its first label after a power cycle about 12 mm
#          shifted, and that label takes the shift. It is reported
#          (printer_reset_calibrated). false only reports the reset
#          (printer_reset_not_calibrated). Two limits: a 'status' or 'memory' run
#          before the job takes the report, so that job's first label can be
#          shifted, and a one-way link cannot see a reset at all.
# Type: boolean
# Default: true
# Environment Variable: DATAMAX_DPL___PRINTER__CALIBRATE_AFTER_RESET=false
# calibrate_after_reset = true

# Purpose: What the calibration label says. Mapped as a text field in font 2 is:
#          a character that font cannot print prints as '?', and reading such a
#          value logs a warning.
# Type: string, 1 to 255 characters
# Default: "Printer Reset - Calibration Feed"
# Environment Variable: DATAMAX_DPL___PRINTER__CALIBRATION_LABEL_TEXT="Feed"
# calibration_label_text = "Printer Reset - Calibration Feed"

# Purpose: How many rounds the upload check of 'print' runs on a
#          two-way link before it refuses a label whose images the printer's
#          directory does not list (image_upload_refused): a download into a
#          full module is lost with no error. 1 uploads and reads once; 2 then
#          clears the module where a clear may go (never a plug-in module) and
#          uploads again; 3 then uploads the images halved 2x2. Each round
#          after the first reports image_upload_retried. 0 reads nothing back
#          and retries nothing. Warning: on an Allegro 2 a format whose image
#          is missing printed the rest with no error (2026-11-01), so a lost
#          download then goes unseen. The names read before downloads no clear
#          precedes still runs with 0: re-sending a name the printer already
#          held printed nothing (2026-10-30).
# Type: integer, 0 to 3
# Default: 3
# Environment Variable: DATAMAX_DPL___PRINTER__UPLOAD_CHECK_ROUNDS=2
# upload_check_rounds = 3

# Purpose: Largest label or data file any command reads (render, validate,
#          print, preview, explain), in bytes; a larger one is refused (exit 2)
#          before it is read whole, so a wrong path fails fast. Raising it
#          raises the peak memory by the file's size, twice that for a JSON
#          array: its bytes are held while its records are read, one record
#          at a time in every format.
# Type: integer, greater than 0, at most 1073741824 (bytes)
# Default: 16777216
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_INPUT_BYTES=67108864
# max_input_bytes = 16777216

# Purpose: Most records one --data batch of 'render', 'validate' or 'print' may
#          hold; more is refused (exit 2) first. A bound on time, not on memory:
#          each record is rendered once (again only where the printer's answer
#          changes the label), and on a two-way link each label with an image
#          costs a directory read of about 1 s plus the printer's answer, two
#          for a new image with no clear before it.
# Type: integer, greater than 0, at most 536870912 (more than a file of the
#       largest max_input_bytes holds)
# Default: 100000
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_BATCH_RECORDS=500000
# max_batch_records = 100000

# Purpose: Most bytes the jobs of one --data batch of 'render' with no -o may
#          come to: the one command that holds the whole job, because its answer
#          is the job. A label of hundreds of large fields comes to more than a
#          megabyte per record. Past it the command stops with exit 2 without
#          rendering the rest; 'render -o FILE', 'validate' and 'print' hold no
#          job. It bounds the job, not the memory: the process holds about 7 times
#          this in human mode and about 8 times with --json (about 550 MB at the
#          default; on Windows about 10 times, about 670 MB). 100000 records of a one-field label come to 6-7 MB.
# Type: integer, greater than 0, at most 1099511627776 (bytes)
# Default: 67108864
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_BATCH_JOB_BYTES=268435456
# max_batch_job_bytes = 67108864

# Purpose: How many findings a --data batch's answer keeps in full; past that it
#          keeps the first of each code and the first error. The answer counts
#          all of them, per code and in total, says so when it cuts, and human
#          mode then prints the counts per code. Any error refuses the job.
# Type: integer, greater than 0, at most 100000000
# Default: 1000
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_REPORTED_FINDINGS=5000
# max_reported_findings = 1000

# Purpose: How many downloaded image names a --data batch's answer lists; the
#          answer counts all of them, and says so when it cuts.
# Type: integer, greater than 0, at most 100000000
# Default: 1000
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_REPORTED_DOWNLOADS=5000
# max_reported_downloads = 1000

# Purpose: Largest piece of a job handed to one write, over tcp and serial. The
#          timeout bounds each piece rather than the whole job, so it means the
#          printer took no data for that long: at the about 1390 bytes/s of a
#          print server feeding a 9600 baud printer, 1024 bytes need under a
#          second. A larger piece needs a timeout long enough to send it. At
#          most 65536: Windows takes one send of any size whole while its
#          socket buffer is not full, so a larger piece comes back sent from a
#          printer that reads nothing and the timeout never fires.
# Type: integer, greater than 0, at most 65536 (bytes)
# Default: 1024
# Environment Variable: DATAMAX_DPL___PRINTER__SEND_CHUNK_BYTES=512
# send_chunk_bytes = 1024

# Purpose: Seconds one opening of a tcp connection keeps retrying a refused
#          connect before it reports the refusal, never longer than timeout. A
#          print server that just closed a job's connection refuses the next one
#          for a moment (about 1-2 s measured on a SerComm PS301). Other connect
#          errors (unknown host, unreachable, timeout) are not retried. A host
#          that keeps refusing is reported after this plus one connect.
# Type: float, greater than 0, at most 2147483
# Default: 3.0
# Environment Variable: DATAMAX_DPL___PRINTER__REFUSED_CONNECT_WAIT=5
# refused_connect_wait = 3.0

# Purpose: Seconds one opening of a tcp connection pauses before it tries a
#          refused connect again within refused_connect_wait. No connect starts
#          once the next one would fall past that wait.
# Type: float, greater than 0, at most 2147483
# Default: 0.25
# Environment Variable: DATAMAX_DPL___PRINTER__REFUSED_CONNECT_RETRY_INTERVAL=0.5
# refused_connect_retry_interval = 0.25

# Purpose: Whether the printer has its cutter installed and enabled.
#          yes:     cut commands are sent as the label asks
#          no:      a label that asks for cutting is refused
#          unknown: cut commands are sent and the result notes the assumption
# Type: string, "yes", "no" or "unknown"
# Default: "unknown"
# Environment Variable: DATAMAX_DPL___PRINTER__CUTTER=yes
cutter = "unknown"

# Purpose: Hardware options installed in the printer that unlock features,
#          currently only "datamatrix" (the DataMatrix barcode option).
# Type: list of strings
# Default: []
# Environment Variable: DATAMAX_DPL___PRINTER__OPTIONS='["datamatrix"]'
options = []

# The calibration and stop-position keys below ship unset (commented out): unset
# means the model's default. The allegro-2 profile carries values measured on one
# Allegro 2 (scale_along 0.976, offset_along -0.25 mm, stop_position 66.8 mm);
# every other model prints nominal (scale 1.0, offset 0.0) and keeps the printer's
# own stop position. A value set here, even 1.0 or 0.0, wins over the model's.

# Purpose: Printed length divided by nominal length across the web, for this one
#          printer: print a long line, measure it, divide by its nominal length.
#          1.0 prints nominal lengths. Set by `calibrate set --across`.
#          Fonts and images sized in dots are not scaled.
# Type: float, 0.5 to 1.5
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__SCALE_ACROSS=0.995
# scale_across = 1.0

# Purpose: Printed length divided by nominal length along the feed. It depends on
#          the platen roller, so two printers of one model can differ (an Allegro 2
#          measured 0.977). Set by `calibrate set --along`.
# Type: float, 0.5 to 1.5
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__SCALE_ALONG=0.977
# scale_along = 1.0

# Purpose: Millimetres every field is moved to the right on this printer, so a print
#          that sits off centre lands where the label asks; negative moves left.
#          Independent of the tear-off and cut positions. Set by `calibrate set`
#          from the borders measured around the across calibration label's frame.
# Type: float, -10 to 10
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__OFFSET_ACROSS=0.2
# offset_across = 0.0

# Purpose: Millimetres every field is moved toward the label top; negative moves
#          it down.
# Type: float, -10 to 10
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__OFFSET_ALONG=-0.25
# offset_along = 0.0

# Purpose: Tear-off stop position in mm: where the printer stops the label after
#          printing, found by trying stop values on the printer. Sent as <STX>f
#          before every job that does not cut, exactly as set (no scale or offset
#          applies). "printer" sends none, the model's default included, and keeps
#          the stop set on the printer. A label's own stop_position or present
#          distance wins. A model without a stop-position command does not get it:
#          the job prints and reports the info finding
#          configured_stop_position_unsupported.
# Type: float, greater than 0, at most 253.746 (999/100 inch, the DPL limit), or
#       "printer"
# Default: unset (the model's default; for most models the printer's own setting)
# Environment Variable: DATAMAX_DPL___PRINTER__STOP_POSITION=66.8
# stop_position = 66.8

# Purpose: Stop position in mm for a job that cuts, where the cutter needs the
#          label. A job that cuts never uses stop_position: it sends this one, or
#          the model's cutter default when this is unset (allegro-2: 76.8, where one
#          Allegro 2's cutter cut in the gap, 2026-11-06), or no stop position on a
#          model without one. Sent exactly as set; a label's own stop_position wins.
#          A model without a stop-position command does not get it and reports
#          configured_stop_position_unsupported.
# Type: float, greater than 0, at most 253.746 (999/100 inch, the DPL limit)
# Default: unset (the model's cutter default, else no stop position)
# Environment Variable: DATAMAX_DPL___PRINTER__CUTTER_STOP_POSITION=80
# cutter_stop_position = 80

# Purpose: Stop position in mm for a record of a --data series that the next
#          record follows uncut (the cutter off for it). Set it at or below the
#          start of print: a stop past it makes the printer pull the stock back
#          before the next record (manual p.22). Unset, it takes the model's
#          default (allegro-2: 25.4, <STX>f100, where one Allegro 2 with its
#          cutter ran a series on without pulling back, 2026-11-09), else such a
#          record stops at cutter_stop_position. Sent exactly as set; a label's
#          own stop_position wins. The last record and the calibration label
#          stop at cutter_stop_position.
# Type: float, greater than 0, at most 253.746 (999/100 inch, the DPL limit)
# Default: unset (the model's default, else the cutter stop)
# Environment Variable: DATAMAX_DPL___PRINTER__JOINED_STOP_POSITION=25.4
# joined_stop_position = 25.4

# Purpose: The cut a label without its own "cut" gets: after every N labels, as
#          "cut": {"every": N} in the label. The label's own "cut" wins. An N at or
#          past the label's quantity cuts once, after the last copy. Unset, a
#          label without a cut is cut only after the last label of the print
#          (cut_after_print below), or not at all where that is off. A label
#          cannot opt out of it; to print one job without it, run it with
#          --set printer.cut_every=null.
# Type: integer, 1 to 9999
# Default: unset (a label without "cut" is cut only at the end of the print)
# Environment Variable: DATAMAX_DPL___PRINTER__CUT_EVERY=3
# cut_every = 3

# Purpose: With cutter "yes" on a model whose job sets the cutter (<STX>V), cut
#          after the last label of every print, one label or a whole --data
#          series: such a printer stops the stock at the cutter, where it cannot
#          be torn off. The labels before the last stay joined unless "cut" or
#          cut_every says otherwise, and a cut's "at_end": false is overridden
#          (finding cut_at_end_kept). The cutter is then on when the print ends,
#          so the printer's FEED key cuts too. feed and the calibration label
#          are never cut. false leaves a print without a cut uncut, the cutter
#          switched off for it.
# Type: boolean
# Default: true
# Environment Variable: DATAMAX_DPL___PRINTER__CUT_AFTER_PRINT=false
# cut_after_print = true

# Purpose: Bytes of image dot data one job may download (rows times bytes per
#          row of every image it sends; images it only places cost nothing). Past
#          it, policy degrade sends every image but a QR Code at half resolution
#          and double magnification (image_halved); strict refuses the job
#          (image_memory_exceeded). `datamax-dpl memory` shows the free bytes.
#          'print' on a two-way link leaves the model's budget out
#          and lets the upload check decide (image_budget_skipped), unless
#          upload_check_rounds is 0, which reads nothing back; a value set
#          here applies there too.
# Type: integer, greater than 0
# Default: unset (the model's budget: 49088 for the Allegro 2, none elsewhere)
# Environment Variable: DATAMAX_DPL___PRINTER__IMAGE_MEMORY_BYTES=40000
# image_memory_bytes = 40000

# Purpose: Memory module the job's images are downloaded to (<STX>I), A to E.
#          Unset takes the model's built-in RAM: module A on most models, E on the
#          DMX 600/800 (there A and B are plug-in modules and D is non-volatile).
#          generic and permissive use A too, which generic never clears.
#          The Prodigy and Prodigy Plus have no built-in module: a job that
#          downloads an image is refused (image_module_unknown) until this names
#          the module fitted. C is the printer's default module on every model;
#          'print' on a two-way link refuses a job that downloads into
#          it before sending anything (image_module_unlisted), since no directory
#          lists it by that letter.
#          `datamax-dpl capabilities MODEL` shows the model's module. Only the
#          model's built-in RAM is ever cleared (<STX>q): another module may be
#          flash, which every clear wears (graphics_clear_skipped).
# Type: string, "A", "B", "C", "D" or "E"
# Default: unset (the model's built-in module)
# Environment Variable: DATAMAX_DPL___PRINTER__IMAGE_MODULE=B
# image_module = "A"

# Purpose: Clear the image module before each label and its downloads, a label
#          without images included: <STX>q to the model's built-in RAM, the plain
#          Prodigy's <STX>R for each name the label downloads; a plug-in module is
#          never cleared. false keeps what
#          the printer stores: a label may then place an image without a bitmap,
#          and a download of a name the printer holds is left out
#          (image_name_held), so 'print' reads the names before each
#          such label, and a --data batch with no printer to read is refused
#          from its second record on (batch_image_names_unread), unless
#          clear_graphics_after clears the module after each label. Keeping a
#          stored image across a --data batch needs clear_graphics_after false
#          too.
# Type: boolean
# Default: true
# Environment Variable: DATAMAX_DPL___PRINTER__CLEAR_GRAPHICS_BEFORE=false
# clear_graphics_before = true

# Purpose: Clear the image module again after each label, the same way, so the
#          next job finds it empty. <STX>q removes every image stored there
#          too, so a --data batch whose label places a stored image (no bitmap)
#          is refused from its second record on (stored_image_cleared) unless
#          both clear keys are false; the plain Prodigy's clear after removes
#          only the label's own downloads.
# Type: boolean
# Default: true
# Environment Variable: DATAMAX_DPL___PRINTER__CLEAR_GRAPHICS_AFTER=false
# clear_graphics_after = true

# Purpose: Severity of the findings of a label whose image downloads no clear
#          precedes (a module that is not the model's built-in RAM, a model that
#          can clear nothing). 'print' then reads the printer's stored
#          image names right before each such label's downloads and leave out the
#          download of each one it holds (image_name_held), since downloading a
#          held name again prints nothing; where the names cannot be read
#          (offline, a one-way link, no answer) a single label downloads every
#          image (image_names_unread). A --data batch of such labels is refused
#          where no printer is read before each label: render, validate with no
#          tcp or serial printer, print to a file (batch_image_names_unread, from
#          the second record on; the first is judged as a single label is),
#          unless the clear after each label reaches the module.
#          error refuses such a label under either policy, a later label of a
#          batch whose image an earlier label stored included.
# Type: string, "info", "warning" or "error"
# Default: "warning"
# Environment Variable: DATAMAX_DPL___PRINTER__HELD_IMAGE_SEVERITY=error
# held_image_severity = "warning"

# Purpose: Highest dot row along the feed one label format may reach, at dot
#          height 1, counted as the job commands it (scale_along and offset_along
#          included). A label whose field passes it is refused under either policy
#          (format_past_max_length); a label dot_size of height 2 doubles it.
#          Unset takes the model's limit, none on every other model than the
#          Allegro 2: 1648 there (about 201 mm at its default scale_along), the
#          lowest row any test format was cut at. Where the printer cuts depends
#          on the format's content in a way that is not understood (a tall
#          element from the bottom was cut at 1648 to 1652, a format with nothing
#          tall printed to 1675), so 1648 is conservative: raise it here for a
#          format that prints further.
# Type: integer, > 0 (dot rows)
# Default: unset (the model's limit)
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_FORMAT_ROWS=1700
# max_format_rows = 1648

# Purpose: Whole printhead dots one 1/100 in prints as, on a printer that rounds
#          the inch unit to whole dots: every distance of a job in 1/100 in is
#          worked out from it. Unset takes the model's: 2 on the Allegro 2 (a
#          787/100 in line printed as 1574 dot rows on one CA02 03.04, not
#          2.03 per unit), the exact unit on every other model. Set it for
#          another firmware or a printer that rounds differently.
# Type: integer, > 0 (dots)
# Default: unset (the model's)
# Environment Variable: DATAMAX_DPL___PRINTER__INCH_UNIT_DOTS=2
# inch_unit_dots = 2

# Purpose: Most points one polygon of a label may have. The manual sets no
#          limit for the polygon record, so this one is ours: a label with a
#          longer polygon is refused when it is read (exit 2). Every point is
#          eight bytes of the record.
# Type: integer, greater than 0, at most 10000
# Default: 60
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_POLYGON_POINTS=120
# max_polygon_points = 60

# The printer state each label's job sets before its format. Another program or
# the front panel may have changed any of it, so the job sends what it relies on.
# The keys below ship unset (commented out): unset means the model's default, and
# a label's own media and stop_position win over them.

# Purpose: Which persistent printer settings each job sends: "media" (<STX>c,
#          then e or r where the model can choose its sensor), "stop" (<STX>f,
#          <STX>Kf), "start_of_print" (<STX>O), "max_label_length" (<STX>M),
#          "feed_rate" (<STX>S), "software_switches" (<STX>V). A setting left
#          out keeps whatever the printer holds; a label's own media or stop it
#          leaves out is reported (label_setting_not_sent). [] sends none.
# Type: list of strings, each one of the six above
# Default: unset (every one)
# Environment Variable: DATAMAX_DPL___PRINTER__SEND_SETTINGS='["media", "stop"]'
# send_settings = ["media", "stop", "start_of_print", "max_label_length", "feed_rate", "software_switches"]

# Purpose: Media sensor a job sets when the label names none: gap (<STX>e),
#          reflective (<STX>r) or continuous (<STX>c with the label's
#          continuous_length or height). The label's own media wins. A model
#          that cannot choose its sensor keeps its own and reports it (info).
# Type: string, "gap", "reflective" or "continuous"
# Default: unset (as the label says, else as the printer holds it)
# Environment Variable: DATAMAX_DPL___PRINTER__MEDIA=gap
# media = "gap"

# Purpose: Start of print in mm, sent as <STX>O exactly as set (no scale or
#          offset). Unset takes the model's default from the manual (p.31):
#          55.88 mm on most models, 63.5 on the Prodigy, 27.94 on the Prodigy
#          Plus and Titan 6200; the Prodigy Max (a DIP switch decides), generic
#          and permissive have none and send none (printer_settings_unknown).
# Type: float, 12.7 to 2539.746 (mm; 50/100 to 9999/100 inch, the DPL limits)
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__START_OF_PRINT_MM=55.88
# start_of_print_mm = 55.88

# Purpose: How far the printer searches for the next label edge, in mm, sent as
#          <STX>M. The manual asks for at least 5 inches (p.30): less is refused.
#          A gap or reflective label not at least 2.54 mm shorter gets no <STX>M
#          (max_label_length_too_short). Unset takes the model's default.
# Type: float, 127 to 2539.746 (mm; 500/100 to 9999/100 inch)
# Default: unset (304.8 or 406.4 by model; none on generic and permissive)
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_LABEL_LENGTH_MM=304.8
# max_label_length_mm = 304.8

# Purpose: Speed the feed button feeds at, sent as <STX>S. A letter outside the
#          model's slew range sends the model's default instead
#          (feed_rate_out_of_range, info). Unset takes the model's slew default
#          (manual Appendix M); the DMX 400 (whose listed default K lies outside
#          its range), generic and permissive have none and send none
#          (printer_settings_unknown).
# Type: string, one speed letter "A" (1 in/s) to "S" (10 in/s)
# Default: unset (the model's slew default)
# Environment Variable: DATAMAX_DPL___PRINTER__FEED_RATE=C
# feed_rate = "C"

# Purpose: Whether the label-present sensor is on. With cutter it sets the bits
#          of the software switches (<STX>V), which override the printer's own
#          until it is switched off. While cutter, or this on a model with a
#          label-present bit, is unknown, no <STX>V is sent
#          (software_switches_not_sent, info): a guessed bit would switch an
#          option off. The Allegro and Allegro 2 have no such bit.
# Type: string, "yes", "no" or "unknown"
# Default: "unknown"
# Environment Variable: DATAMAX_DPL___PRINTER__LABEL_PRESENT=no
# label_present = "unknown"

# Seven label settings for every label that sets none of its own: the label's
# own value wins. Each ships unset, which sends nothing, so the printer keeps
# whatever it holds; no model default goes out. A set key takes the label
# field's type and bounds and meets the same checks against the model (a heat
# or speed past its range is clamped, a model without the command deviates).
# Lengths are in mm whatever unit a label uses, and print through scale_across
# and scale_along like the label's own.

# Purpose: Heat (Hnn) for a label that sets none.
# Type: integer, 0 to 30 (the model's maximum applies: 20 on most models)
# Default: unset (the printer's own)
# Environment Variable: DATAMAX_DPL___PRINTER__HEAT=12
# heat = 12

# Purpose: Print speed (Px) for a label that sets none.
# Type: string, one speed letter "A" (1 in/s) to "S" (10 in/s)
# Default: unset (the printer's own)
# Environment Variable: DATAMAX_DPL___PRINTER__PRINT_SPEED=C
# print_speed = "C"

# Purpose: Slew speed (Sx) for a label that sets none.
# Type: string, one speed letter "A" (1 in/s) to "S" (10 in/s)
# Default: unset (the printer's own)
# Environment Variable: DATAMAX_DPL___PRINTER__SLEW_SPEED=C
# slew_speed = "C"

# Purpose: Backfeed speed (pX) for a label that sets none; a model without one
#          deviates (speed_unsupported).
# Type: string, one speed letter "A" (1 in/s) to "S" (10 in/s)
# Default: unset (the printer's own)
# Environment Variable: DATAMAX_DPL___PRINTER__BACKUP_SPEED=C
# backup_speed = "C"

# Purpose: Column offset (Cnnnn) in mm for a label that sets none. The
#          calibration label after a reset and the 'calibrate print'
#          labels take none.
# Type: float, 0 to 100000 (mm)
# Default: unset (the printer's own)
# Environment Variable: DATAMAX_DPL___PRINTER__COLUMN_OFFSET=2.5
# column_offset = 2.5

# Purpose: Row offset (Rnnnn) in mm for a label that sets none. The
#          calibration label after a reset and the 'calibrate print'
#          labels take none.
# Type: float, 0 to 100000 (mm)
# Default: unset (the printer's own)
# Environment Variable: DATAMAX_DPL___PRINTER__ROW_OFFSET=2.5
# row_offset = 2.5

# Purpose: Present distance (<STX>Kf) in mm for a label that sets none: how far
#          a printed label is fed out for removal. Sent only on a model with
#          <STX>Kf; elsewhere it is not sent (configured_present_distance_unsupported,
#          info), so set stop_position or cutter_stop_position there. More
#          than 9999/100 in is refused (present_distance_too_large).
# Type: float, greater than 0, at most 100000 (mm)
# Default: unset (the printer's own)
# Environment Variable: DATAMAX_DPL___PRINTER__PRESENT_DISTANCE=10
# present_distance = 10

# ------------------------------------------------------------------------------
# Named printers - one section per printer, chosen with --printer NAME
# ------------------------------------------------------------------------------
#
# Each [printers.<name>] section takes the keys of [printer] above and wins over
# them key by key; a key it does not set comes from [printer]. Command-line flags
# still win over both. A name takes letters, digits, '_' and '-' (not first),
# never ':', so it cannot be mistaken for a URI. Two more keys, valid here and in [printer]:
#   label_width, label_height  the loaded labels' size in mm ('calibrate print' uses them)
#
# [printers.lager]
# model = "allegro-2"
# uri = "tcp://192.0.2.60:9100"
# label_width = 100
# label_height = 55
# scale_along = 0.977
#
# Environment Variable: DATAMAX_DPL___PRINTERS__LAGER__SCALE_ALONG=0.977

# -------------------------------------------------------------------------------
# [preview]: how large a picture 'preview' draws
# -------------------------------------------------------------------------------
[preview]

# Purpose: Longest side of a preview in mm. One number in a label decides how much
#          memory the picture takes, so a label past this is refused before drawing.
# Type: float, above 0, at most 100000
# Default: 2000.0
# Environment Variable: DATAMAX_DPL___PREVIEW__MAX_LENGTH_MM=3000
max_length_mm = 2000.0
