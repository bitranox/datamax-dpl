# ==============================================================================
# Printer Configuration - the Datamax printer this CLI renders for and prints to
# ==============================================================================
#
# Settings are loaded via lib_layered_config and can be overridden via:
#   - App/Host/User config files (see precedence list in defaultconfig.toml)
#   - Environment variables (see below)
#   - Command-line flags (--model, --printer and friends win over everything here)
#
# Environment Variable Naming
# ---------------------------
#   Format: <SLUG>___<SECTION>__<KEY>=<VALUE>
#
#   Examples:
#     DATAMAX_DPL___PRINTER__MODEL=dmx-600
#     DATAMAX_DPL___PRINTER__URI=tcp://192.0.2.60:9100
#
# .env File Support
# -----------------
# In .env files (no prefix needed), use double underscore for nesting:
#
#   PRINTER__MODEL=dmx-600
#   PRINTER__URI=serial:///dev/ttyS0?baud=9600
#
# Precedence (lowest to highest):
#   defaults -> app config -> host config -> user config -> .env file -> env vars
#
[printer]

# Purpose: Printer model profile that decides which DPL features may be used.
#          'datamax-dpl models' lists every profile. 'generic' emits only what
#          every model in the manual understands.
# Type: string
# Default: "generic"
# Environment Variable: DATAMAX_DPL___PRINTER__MODEL=dmx-600
model = "generic"

# Purpose: Firmware version of the printer, when a feature depends on it
#          (for example "2.01" unlocks circles on a DMX 400). Empty: assume the
#          oldest firmware the manual describes.
# Type: string, "<major>.<minor>"
# Default: ""
# Environment Variable: DATAMAX_DPL___PRINTER__FIRMWARE=2.01
firmware = ""

# Purpose: Where 'print' and the printer commands send their bytes.
#          tcp://HOST:PORT              raw socket, usually port 9100
#          serial:///dev/ttyS0?baud=9600&parity=N&bytesize=8&stopbits=1
#          device:///dev/usb/lp0        write to a device file
#          file:PATH                    write to a file
#          -                            write to stdout
#          Empty: every command that talks to a printer needs --printer.
# Type: string
# Default: ""
# Environment Variable: DATAMAX_DPL___PRINTER__URI=tcp://192.0.2.60:9100
uri = ""

# Purpose: What to do when the label uses a feature the model lacks.
#          degrade: apply the documented fallback and report each one
#          strict:  refuse the label instead
# Type: string, "degrade" or "strict"
# Default: "degrade"
# Environment Variable: DATAMAX_DPL___PRINTER__POLICY=strict
policy = "degrade"

# Purpose: Timeout for one transport operation (connect, write one piece of a
#          job, an answer), in seconds. 'status' and 'memory' wait status_wait
#          in all for their first answer, and 'verify' as long for the printer
#          to finish its job.
# Type: float, greater than 0
# Default: 10.0
# Environment Variable: DATAMAX_DPL___PRINTER__TIMEOUT=10.0
timeout = 10.0

# Purpose: Seconds 'status' and 'memory' keep trying for the printer's first
#          answer while a print server is still busy with an earlier job, and
#          'verify' waits in all for the printer to finish its job. A
#          connection that took no request (refused, timed out while
#          connecting, closed or reset before the request or a byte of answer)
#          is tried again on a new one; an open but silent connection is read
#          until the wait ends and never asked twice. 'memory' waits at most
#          120 s on one connection. --timeout on those commands sets the whole
#          wait instead.
# Type: float, greater than 0, at most 2147483
# Default: 30.0
# Environment Variable: DATAMAX_DPL___PRINTER__STATUS_WAIT=45
# status_wait = 30.0

# Purpose: Seconds 'status' and 'memory' pause between two connections within
#          status_wait, and 'print' and 'verify' within stored_names_wait.
# Type: float, greater than 0, at most 2147483
# Default: 0.25
# Environment Variable: DATAMAX_DPL___PRINTER__STATUS_RETRY_INTERVAL=0.5
# status_retry_interval = 0.25

# Purpose: Seconds 'print' and 'verify' keep trying for each read of the
#          printer's stored image names (<STX>W): before a job no clear
#          precedes, and in each round of the upload check after a label's
#          downloads. The answer's last byte must arrive within it (the 1 s of
#          silence that ends the answer comes on top); 'status', 'memory' and
#          verify's wait for the printer use status_wait. A printer was measured
#          silent for 10-20 s after an image job, so a repeat print right after
#          one still reads the names. On a link that never answers, each read
#          waits this long, and the upload check refuses the label after its
#          rounds; lower it there. --timeout leaves it.
# Type: float, greater than 0, at most 2147483
# Default: 30.0
# Environment Variable: DATAMAX_DPL___PRINTER__STORED_NAMES_WAIT=10
# stored_names_wait = 30.0

# Purpose: Seconds 'print' and 'verify' wait for the one status read (<SOH>A)
#          they make before a job on a two-way link: the printer's first answer
#          after a power cycle or a software reset reports it, once. One try, no
#          retry. No answer means nothing: the job goes on as it would have.
#          --timeout leaves it.
# Type: float, greater than 0, at most 2147483
# Default: 3.0
# Environment Variable: DATAMAX_DPL___PRINTER__RESET_CHECK_WAIT=1
# reset_check_wait = 3.0

# Purpose: On a reported reset, print one calibration label before the job: the
#          job's printer settings and label size, one text in the middle. One
#          Allegro 2 printed its first label after a power cycle about 12 mm
#          shifted, and that label takes the shift. It is reported
#          (printer_reset_calibrated). false only reports the reset
#          (printer_reset_not_calibrated). Two limits: a 'status' or 'memory' run
#          before the job takes the report, so that job's first label can be
#          shifted, and a one-way link cannot see a reset at all.
# Type: boolean
# Default: true
# Environment Variable: DATAMAX_DPL___PRINTER__CALIBRATE_AFTER_RESET=false
# calibrate_after_reset = true

# Purpose: What the calibration label says. Mapped as a text field in font 2 is:
#          a character that font cannot print prints as '?', and reading such a
#          value logs a warning.
# Type: string, 1 to 255 characters
# Default: "Printer Reset - Calibration Feed"
# Environment Variable: DATAMAX_DPL___PRINTER__CALIBRATION_LABEL_TEXT="Feed"
# calibration_label_text = "Printer Reset - Calibration Feed"

# Purpose: How many rounds the upload check of 'print' and 'verify' runs on a
#          two-way link before it refuses a label whose images the printer's
#          directory does not list (image_upload_refused): a download into a
#          full module is lost with no error. 1 uploads and reads once; 2 then
#          clears the module where a clear may go (never a plug-in module) and
#          uploads again; 3 then uploads the images halved 2x2. Each round
#          after the first reports image_upload_retried.
# Type: integer, 1 to 3
# Default: 3
# Environment Variable: DATAMAX_DPL___PRINTER__UPLOAD_CHECK_ROUNDS=2
# upload_check_rounds = 3

# Purpose: Most records one --data batch of 'render', 'validate' or 'print' may
#          hold; more is refused (exit 2) first. A bound on time, not on memory:
#          each record is rendered once to check it and again to send it.
# Type: integer, greater than 0, at most 10000000
# Default: 100000
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_BATCH_RECORDS=500000
# max_batch_records = 100000

# Purpose: Most bytes the jobs of one --data batch of 'render' with no -o may
#          come to: the one command that holds the whole job, because its answer
#          is the job. A label of hundreds of large fields comes to more than a
#          megabyte per record. Past it the command stops with exit 2 without
#          rendering the rest; 'render -o FILE', 'validate' and 'print' hold no
#          job. The default leaves room for 100000 records of a one-field label
#          (about 430 MB).
# Type: integer, greater than 0, at most 1099511627776 (bytes)
# Default: 1073741824
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_BATCH_JOB_BYTES=268435456
# max_batch_job_bytes = 1073741824

# Purpose: How many findings a --data batch's answer shows in full; the answer
#          counts all of them, per code and in total, and says so when it cuts.
#          The first error is always shown, and any error refuses the job.
# Type: integer, greater than 0, at most 100000000
# Default: 1000
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_REPORTED_FINDINGS=5000
# max_reported_findings = 1000

# Purpose: How many downloaded image names a --data batch's answer lists; the
#          answer counts all of them, and says so when it cuts.
# Type: integer, greater than 0, at most 100000000
# Default: 1000
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_REPORTED_DOWNLOADS=5000
# max_reported_downloads = 1000

# Purpose: Largest piece of a job handed to one write, over tcp and serial. The
#          timeout bounds each piece rather than the whole job, so it means the
#          printer took no data for that long: at the about 1390 bytes/s of a
#          print server feeding a 9600 baud printer, 1024 bytes need under a
#          second. A larger piece needs a timeout long enough to send it. At
#          most 65536: Windows takes one send of any size whole while its
#          socket buffer is not full, so a larger piece comes back sent from a
#          printer that reads nothing and the timeout never fires.
# Type: integer, greater than 0, at most 65536 (bytes)
# Default: 1024
# Environment Variable: DATAMAX_DPL___PRINTER__SEND_CHUNK_BYTES=512
# send_chunk_bytes = 1024

# Purpose: Seconds between a busy answer and the next status poll while 'verify'
#          waits for the printer to finish its job. That whole wait is
#          status_wait (or --timeout), waited as 'status' waits: a silent printer
#          is read until it ends and never asked twice.
# Type: float, greater than 0, at most 2147483
# Default: 0.5
# Environment Variable: DATAMAX_DPL___PRINTER__VERIFY_POLL_INTERVAL=1.0
# verify_poll_interval = 0.5

# Purpose: Seconds 'verify' waits after sending, instead of polling, on a channel
#          that cannot read the printer's status (file, device file).
# Type: float, 0 or more, at most 2147483
# Default: 5.0
# Environment Variable: DATAMAX_DPL___PRINTER__ONE_WAY_SETTLE=10
# one_way_settle = 5.0

# Purpose: Whether the printer has its cutter installed and enabled.
#          yes:     cut commands are sent as the label asks
#          no:      a label that asks for cutting is refused
#          unknown: cut commands are sent and the result notes the assumption
# Type: string, "yes", "no" or "unknown"
# Default: "unknown"
# Environment Variable: DATAMAX_DPL___PRINTER__CUTTER=yes
cutter = "unknown"

# Purpose: Hardware options installed in the printer that unlock features,
#          currently only "datamatrix" (the DataMatrix barcode option).
# Type: list of strings
# Default: []
# Environment Variable: DATAMAX_DPL___PRINTER__OPTIONS='["datamatrix"]'
options = []

# The calibration and stop-position keys below ship unset (commented out): unset
# means the model's default. The allegro-2 profile carries values measured on one
# Allegro 2 (scale_along 0.976, offset_along -0.25 mm, stop_position 66.8 mm);
# every other model prints nominal (scale 1.0, offset 0.0) and keeps the printer's
# own stop position. A value set here, even 1.0 or 0.0, wins over the model's.

# Purpose: Printed length divided by nominal length across the web, for this one
#          printer: print a long line, measure it, divide by its nominal length.
#          1.0 prints nominal lengths. Set by `calibrate set --across`.
#          Fonts and images sized in dots are not scaled.
# Type: float, 0.5 to 1.5
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__SCALE_ACROSS=0.995
# scale_across = 1.0

# Purpose: Printed length divided by nominal length along the feed. It depends on
#          the platen roller, so two printers of one model can differ (an Allegro 2
#          measured 0.977). Set by `calibrate set --along`.
# Type: float, 0.5 to 1.5
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__SCALE_ALONG=0.977
# scale_along = 1.0

# Purpose: Millimetres every field is moved to the right on this printer, so a print
#          that sits off centre lands where the label asks; negative moves left.
#          Independent of the tear-off and cut positions. Set by `calibrate set`
#          from the borders measured around the across calibration label's frame.
# Type: float, -10 to 10
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__OFFSET_ACROSS=0.2
# offset_across = 0.0

# Purpose: Millimetres every field is moved toward the label top; negative moves
#          it down.
# Type: float, -10 to 10
# Default: unset (the model's default)
# Environment Variable: DATAMAX_DPL___PRINTER__OFFSET_ALONG=-0.25
# offset_along = 0.0

# Purpose: Tear-off stop position in mm: where the printer stops the label after
#          printing, found by trying stop values on the printer. Sent as <STX>f
#          before every job that does not cut, exactly as set (no scale or offset
#          applies). "printer" sends none, the model's default included, and keeps
#          the stop set on the printer. A label's own stop_position or present
#          distance wins. A model without a stop-position command does not get it:
#          the job prints and reports the info finding
#          configured_stop_position_unsupported.
# Type: float, greater than 0, at most 253.746 (999/100 inch, the DPL limit), or
#       "printer"
# Default: unset (the model's default; for most models the printer's own setting)
# Environment Variable: DATAMAX_DPL___PRINTER__STOP_POSITION=66.8
# stop_position = 66.8

# Purpose: Stop position in mm for a job that cuts, where the cutter needs the
#          label. A job that cuts never uses stop_position: it sends this one, or no
#          stop position at all when this is unset. Sent exactly as set; a label's
#          own stop_position wins. A model without a stop-position command does not
#          get it and reports configured_stop_position_unsupported.
# Type: float, greater than 0, at most 253.746 (999/100 inch, the DPL limit)
# Default: unset (no stop position for a job that cuts)
# Environment Variable: DATAMAX_DPL___PRINTER__CUTTER_STOP_POSITION=80
# cutter_stop_position = 80

# Purpose: Bytes of image dot data one job may download (rows times bytes per
#          row of every image it sends; images it only places cost nothing). Past
#          it, policy degrade sends every image but a QR Code at half resolution
#          and double magnification (image_halved); strict refuses the job
#          (image_memory_exceeded). `datamax-dpl memory` shows the free bytes.
#          'print' and 'verify' on a two-way link leave the model's budget out
#          and let the upload check decide (image_budget_skipped); a value set
#          here applies there too.
# Type: integer, greater than 0
# Default: unset (the model's budget: 44535 for the Allegro 2, none elsewhere)
# Environment Variable: DATAMAX_DPL___PRINTER__IMAGE_MEMORY_BYTES=40000
# image_memory_bytes = 40000

# Purpose: Memory module the job's images are downloaded to (<STX>I), A to E.
#          Unset takes the model's built-in RAM: module A on most models, E on the
#          DMX 600/800 (there A and B are plug-in modules and D is non-volatile).
#          The Prodigy and Prodigy Plus have no built-in module: a job that
#          downloads an image is refused (image_module_unknown) until this names
#          the module fitted. C is the printer's default module on every model;
#          'print' and 'verify' on a two-way link refuse a job that downloads into
#          it before sending anything (image_module_unlisted), since no directory
#          lists it by that letter.
#          `datamax-dpl capabilities MODEL` shows the model's module. Only the
#          model's built-in RAM is ever cleared (<STX>q): another module may be
#          flash, which every clear wears (graphics_clear_skipped).
# Type: string, "A", "B", "C", "D" or "E"
# Default: unset (the model's built-in module)
# Environment Variable: DATAMAX_DPL___PRINTER__IMAGE_MODULE=B
# image_module = "A"

# Purpose: Severity of the findings of a label whose image downloads no clear
#          precedes (a module that is not the model's built-in RAM, a model that
#          can clear nothing). 'print' and 'verify' then read the printer's stored
#          image names first and leave out the download of each one it holds
#          (image_name_held), since downloading a held name again prints nothing;
#          where the names cannot be read (offline, a one-way link, no answer)
#          every image is downloaded (image_names_unread). error refuses such a
#          label under either policy.
# Type: string, "info", "warning" or "error"
# Default: "warning"
# Environment Variable: DATAMAX_DPL___PRINTER__HELD_IMAGE_SEVERITY=error
# held_image_severity = "warning"

# Purpose: Highest dot row along the feed one label format may reach, at dot
#          height 1, counted as the job commands it (scale_along and offset_along
#          included). A label whose field passes it is refused under either policy
#          (format_past_max_length); a label dot_size of height 2 doubles it.
#          Unset takes the model's limit, none on every other model than the
#          Allegro 2: 1648 there (about 201 mm at its default scale_along), the
#          lowest row any test format was cut at. Where the printer cuts depends
#          on the format's content in a way that is not understood (a tall
#          element from the bottom was cut at 1648 to 1652, a format with nothing
#          tall printed to 1675), so 1648 is conservative: raise it here for a
#          format that prints further.
# Type: integer, > 0 (dot rows)
# Default: unset (the model's limit)
# Environment Variable: DATAMAX_DPL___PRINTER__MAX_FORMAT_ROWS=1700
# max_format_rows = 1648

# ------------------------------------------------------------------------------
# Named printers - one section per printer, chosen with --printer NAME
# ------------------------------------------------------------------------------
#
# Each [printers.<name>] section takes the keys of [printer] above and wins over
# them key by key; a key it does not set comes from [printer]. Command-line flags
# still win over both. A name takes letters, digits, '_' and '-' (not first),
# never ':', so it cannot be mistaken for a URI. Two more keys, valid here and in [printer]:
#   label_width, label_height  the loaded labels' size in mm ('calibrate print' uses them)
#
# [printers.lager]
# model = "allegro-2"
# uri = "tcp://192.0.2.60:9100"
# label_width = 100
# label_height = 55
# scale_along = 0.977
#
# Environment Variable: DATAMAX_DPL___PRINTERS__LAGER__SCALE_ALONG=0.977

# -------------------------------------------------------------------------------
# [preview]: how large a picture 'preview' and 'verify' draw
# -------------------------------------------------------------------------------
[preview]

# Purpose: Longest side of a preview in mm. One number in a label decides how much
#          memory the picture takes, so a label past this is refused before drawing;
#          'verify' refuses it before printing, as its expected picture needs it too.
# Type: float, above 0
# Default: 2000.0
# Environment Variable: DATAMAX_DPL___PREVIEW__MAX_LENGTH_MM=3000
max_length_mm = 2000.0
